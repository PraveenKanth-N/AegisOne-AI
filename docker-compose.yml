version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/aegisone
      - USE_NEO4J=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=aegisone_secret
      - AI_PROVIDER=mock
      - VULNERABLE_APP_URL=http://vulnerable-lab:8001
      - ALLOWED_TARGET_HOSTS=localhost,127.0.0.1,host.docker.internal,vulnerable-lab
    depends_on:
      - postgres
      - neo4j
      - vulnerable-lab
    networks:
      - aegis-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - aegis-net

  vulnerable-lab:
    build:
      context: ./vulnerable-lab
      dockerfile: ../docker/Dockerfile.lab
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LAB_MODE=isolated_demo
    networks:
      - aegis-net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aegisone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis-net

  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/aegisone_secret
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - aegis-net

volumes:
  postgres_data:
  neo4j_data:

networks:
  aegis-net:
    driver: bridge
